<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | AuthntcG</title>
    <script src="https://cdn.tailwindcss.com?plugins=container-queries,typography"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-bs-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#0d6efd',
                        secondary: '#6c757d',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/script/css/style.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body id="desktop-body" class="overflow-hidden relative h-screen w-screen" style="user-select: none;">
    <app-preloader class="preload-page">
        <progress id="loading-bar" value="0" max="100"></progress>
    </app-preloader>

    <div class="absolute glass-panel rounded-lg shadow-lg py-2 context-menu ctx-hide" style="z-index: 10000;"
        id="desktop-context-menu">
        <div class="context-item" onclick="handleMenuAction('change-wallpaper')"><iconify-icon icon="bi:image" class="mr-2 text-inherit"></iconify-icon> Ganti
            Wallpaper</div>
        <div class="context-item" onclick="handleMenuAction('toggle-theme')"><iconify-icon icon="fluent:weather-moon-24-regular" class="mr-2 text-inherit"></iconify-icon>
            Switch Light/Dark</div>
        <hr class="my-1 border-gray-500 opacity-25">
        <div class="context-item" onclick="handleMenuAction('refresh-desktop')"><iconify-icon icon="bi:arrow-clockwise" class="mr-2 text-inherit"></iconify-icon> Refresh</div>
    </div>

    <div class="absolute glass-panel rounded-lg shadow-lg py-2 context-menu ctx-hide" style="z-index: 10000;" id="icon-context-menu">
        <div class="context-item"><iconify-icon icon="bi:pencil-square" class="mr-2 text-inherit"></iconify-icon> Rename</div>
        <div class="context-item text-red-500"><iconify-icon icon="bi:trash" class="mr-2 text-inherit"></iconify-icon> Delete Icon</div>
    </div>

    <div id="desktop-icons-container"
        class="absolute top-0 left-0 w-full h-full p-3 flex flex-col flex-wrap gap-3 items-start z-10"
        style="padding-bottom: 80px !important;">
        <div class="desktop-icon text-center rounded-lg p-2" onclick="WindowManager.openAbout()">
            <div class="adaptive-icon grad-blue mx-auto mb-1"><iconify-icon icon="bi:person-fill" class="text-white text-3xl text-inherit"></iconify-icon></div>
            <span class="icon-label text-white text-shadow text-sm">About Me</span>
        </div>
        <div class="desktop-icon text-center rounded-lg p-2" onclick="WindowManager.openPDF()">
            <div class="adaptive-icon grad-red mx-auto mb-1"><iconify-icon icon="bi:file-earmark-pdf-fill" class="text-white text-3xl text-inherit"></iconify-icon>
            </div>
            <span class="icon-label text-white text-shadow text-sm">Resume</span>
        </div>
        <div class="desktop-icon text-center rounded-lg p-2"
            onclick="WindowManager.openWindow({id:'win-inspiro', title:'Inspiro Dashboard', url:'project/inspiro/index.html', width:'1000px', height:'600px'})">
            <div class="adaptive-icon grad-green mx-auto mb-1"><iconify-icon icon="bi:speedometer2" class="text-white text-3xl text-inherit"></iconify-icon></div>
            <span class="icon-label text-white text-shadow text-sm">Inspiro</span>
        </div>
    </div>

    <div id="start-menu" class="absolute glass-panel rounded-2xl shadow-lg panel-transition scale-hide flex flex-col" style="z-index: 9999; bottom: 80px; left: 50%; transform: translateX(-50%); width: 700px; max-width: 95vw; height: 550px; max-height: calc(100vh - 100px);">
        <div class="p-4 border-b border-gray-500 border-opacity-25">
            <div class="flex items-center bg-transparent border border-gray-500 border-opacity-25 rounded-md overflow-hidden">
                <span class="px-3 text-gray-500"><iconify-icon icon="fluent:search-24-regular" class="text-inherit"></iconify-icon></span>
                <input type="text" class="w-full bg-transparent outline-none py-2 px-2 shadow-none" placeholder="Type to search...">
            </div>
        </div>
        <div class="flex flex-col md:flex-row grow overflow-y-auto md:overflow-hidden p-2 gap-2">
            <div class="w-full md:w-1/2 overflow-visible md:overflow-auto p-3 shrink-0">
                <h6 class="uppercase text-sm text-gray-500 font-bold mb-3">Pinned Apps</h6>
                <div class="start-item flex items-center p-2 rounded-lg mb-1 hover:bg-black/10 cursor-pointer transition-colors" onclick="WindowManager.openWindow({id:'win-obj', title:'Object Detection', url:'project/object-detection/index.html', width:'900px', height:'650px'})">
                    <div class="adaptive-icon-sm grad-green mr-3"><iconify-icon icon="fluent:camera-24-regular" class="text-white text-inherit"></iconify-icon></div>
                    <span class="font-medium text-on-surface">Object Detection</span>
                </div>
                <div class="start-item flex items-center p-2 rounded-lg mb-1 hover:bg-black/10 cursor-pointer transition-colors" onclick="WindowManager.openQRGenerator()">
                    <div class="adaptive-icon-sm grad-purple mr-3"><iconify-icon icon="bi:qr-code" class="text-white text-inherit"></iconify-icon></div>
                    <span class="font-medium text-on-surface">QR Generator</span>
                </div>
                <div class="start-item flex items-center p-2 rounded-lg mb-1 hover:bg-black/10 cursor-pointer transition-colors" onclick="WindowManager.openAbout()">
                    <div class="adaptive-icon-sm grad-blue mr-3"><iconify-icon icon="fluent:person-24-regular" class="text-white text-inherit"></iconify-icon></div>
                    <span class="font-medium text-on-surface">About Author</span>
                </div>
            </div>
            <div class="w-full md:w-1/2 p-3 overflow-visible md:overflow-auto rounded-lg bg-black/10 border border-gray-500 border-opacity-25 shrink-0">
                <h6 class="uppercase text-sm text-gray-500 font-bold mb-3">Widgets</h6>
                <div class="flex flex-wrap -mx-1">
                    <div class="w-full px-1">
                        <div class="p-3 rounded-2xl grad-blue text-white shadow-sm h-full relative overflow-hidden cursor-pointer" onclick="WindowManager.openWindow({id:'win-inspiro', title:'Inspiro Dashboard', url:'project/inspiro/index.html', width:'1000px', height:'600px'})">
                            <div class="absolute" style="right: -15px; bottom: -25px; opacity: 0.2; font-size: 6rem;">
                                <iconify-icon icon="fluent:weather-sunny-24-regular" class="weather-icon text-inherit"></iconify-icon>
                            </div>
                            <div class="flex justify-between mb-2 relative z-10">
                                <span class="font-medium">Cuaca Saat Ini</span>
                                <div class="text-2xl"><iconify-icon icon="fluent:weather-sunny-24-regular" class="weather-icon text-inherit"></iconify-icon></div>
                            </div>
                            <h2 class="mb-0 text-3xl font-bold weather-temp relative z-10">--°C</h2>
                            <small class="weather-desc relative z-10 capitalize">Mengambil data...</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="p-3 border-t border-gray-500 border-opacity-25 flex justify-between items-center bg-black/5 rounded-b-2xl">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold">G</div>
                <span class="text-sm font-medium text-on-surface">Galih Respati</span>
            </div>
            <button class="p-2 rounded-lg hover:bg-black/10 border-0 text-red-500 transition-colors" title="Power" onclick="window.close()">
                <iconify-icon icon="fluent:power-24-regular" class="text-lg text-inherit"></iconify-icon>
            </button>
        </div>
    </div>

    <div id="clock-panel" class="absolute glass-panel rounded-2xl shadow-lg panel-transition scale-hide flex flex-col" style="z-index: 9999; bottom: 80px; width: 340px; max-width: calc(100vw - 20px); right: 10px;">
        <div class="p-4 border-b border-gray-500 border-opacity-25">
            <h2 class="text-4xl font-light mb-1 text-on-surface" id="panel-time-large">10:00</h2>
            <p class="text-sm text-on-surface opacity-75 m-0" id="panel-date-large">Senin, 1 Januari</p>
        </div>
        
        <div class="p-4 border-b border-gray-500 border-opacity-25">
            <div class="flex justify-between items-center mb-3">
                <h6 class="font-medium text-sm m-0 text-on-surface" id="calendar-month-year">Januari 2023</h6>
                <div class="flex gap-1">
                    <button class="btn btn-sm btn-light p-1 rounded hover:bg-black/10 transition-colors" onclick="DesktopUI.changeMonth(-1)"><iconify-icon icon="bi:chevron-up" class="text-inherit"></iconify-icon></button>
                    <button class="btn btn-sm btn-light p-1 rounded hover:bg-black/10 transition-colors" onclick="DesktopUI.changeMonth(1)"><iconify-icon icon="bi:chevron-down" class="text-inherit"></iconify-icon></button>
                </div>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs mb-2 font-medium text-on-surface opacity-75">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-sm" id="calendar-days-grid">
            </div>
        </div>
    </div>

    <div id="main-taskbar"
        class="fixed bottom-0 left-1/2 -translate-x-1/2 mb-2 taskbar-glass rounded-full flex items-center px-2 shadow-lg gap-2" style="z-index: 9999; height: 60px; min-width: max-content; max-width: 95vw;">
        <div class="flex items-center h-full" id="taskbar-apps">
            <button class="mx-1 p-0 rounded-lg border-0 group hover:opacity-80"
                onclick="DesktopUI.toggleStartMenu(event)">
                <div class="adaptive-icon grad-blue flex items-center justify-center shadow-sm"
                    style="width: 45px; height: 45px;">
                    <iconify-icon icon="fluent:apps-24-filled" class="text-white text-2xl text-inherit"></iconify-icon>
                </div>
            </button>
            <div class="w-px bg-gray-400 mx-2 opacity-25" style="height: 30px;"></div>

            <div id="taskbar-dynamic-apps" class="flex items-center h-full gap-1"></div>
        </div>

        <div id="taskbar-divider-2" class="w-px bg-gray-400 mx-2 opacity-25 hidden" style="height: 30px;"></div>

        <div class="flex items-center h-full px-2 gap-1">
            <button class="px-2 py-1 hover:bg-black/10 border-0 rounded-lg text-on-surface" onclick="DesktopUI.toggleTheme()"><iconify-icon icon="fluent:weather-moon-24-regular" class="text-inherit"></iconify-icon></button>
            <button
                class="hover:bg-black/10 border-0 rounded-lg flex flex-col items-center justify-center px-3 h-full"
                onclick="DesktopUI.toggleClockPanel(event)">
                <span class="text-sm font-medium" id="taskbar-time" style="line-height: 1.2;">10:00 AM</span>
                <span style="font-size: 0.65rem; line-height: 1;">24/10/23</span>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script src="assets/script/js/component.js"></script>
    <script src="assets/script/js/qr-generator.js"></script>
    <script type="module" src="assets/script/js/script.js"></script>
</body>
</html>
