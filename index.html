<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | AuthntcG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/script/css/style.css">
</head>

<body id="desktop-body" class="overflow-hidden position-relative vh-100 vw-100" style="user-select: none;">
    <app-preloader class="preload-page">
        <progress id="loading-bar" value="0" max="100"></progress>
    </app-preloader>

    <div class="position-fixed glass-panel rounded-3 shadow-lg z-3 py-2 context-menu ctx-hide"
        id="desktop-context-menu">
        <div class="context-item" onclick="handleMenuAction('change-wallpaper')"><i class="bi bi-image me-2"></i> Ganti
            Wallpaper</div>
        <div class="context-item" onclick="handleMenuAction('toggle-theme')"><i class="bi bi-moon-stars me-2"></i>
            Switch Light/Dark</div>
        <hr class="my-1 border-secondary opacity-25">
        <div class="context-item" onclick="handleMenuAction('refresh-desktop')"><i
                class="bi bi-arrow-clockwise me-2"></i> Refresh</div>
    </div>

    <div class="position-fixed glass-panel rounded-3 shadow-lg z-3 py-2 context-menu ctx-hide" id="icon-context-menu">
        <div class="context-item"><i class="bi bi-pencil-square me-2"></i> Rename</div>
        <div class="context-item text-danger"><i class="bi bi-trash me-2"></i> Delete Icon</div>
    </div>

    <div id="desktop-icons-container"
        class="position-absolute top-0 start-0 w-100 h-100 p-3 d-flex flex-column flex-wrap gap-3 align-items-start z-1"
        style="padding-bottom: 80px !important;">
        <div class="desktop-icon text-center rounded-3 p-2" onclick="WindowManager.openAbout()">
            <div class="adaptive-icon grad-blue mx-auto mb-1"><i class="bi bi-person-fill text-white fs-3"></i></div>
            <span class="icon-label text-white text-shadow small">About Me</span>
        </div>
        <div class="desktop-icon text-center rounded-3 p-2" onclick="WindowManager.openPDF()">
            <div class="adaptive-icon grad-red mx-auto mb-1"><i class="bi bi-file-earmark-pdf-fill text-white fs-3"></i>
            </div>
            <span class="icon-label text-white text-shadow small">Resume</span>
        </div>
        <div class="desktop-icon text-center rounded-3 p-2"
            onclick="WindowManager.openWindow({id:'win-inspiro', title:'Inspiro Dashboard', url:'project/inspiro/index.html', width:'1000px', height:'600px'})">
            <div class="adaptive-icon grad-green mx-auto mb-1"><i class="bi bi-speedometer2 text-white fs-3"></i></div>
            <span class="icon-label text-white text-shadow small">Inspiro</span>
        </div>
    </div>

    <div id="start-menu" class="position-absolute glass-panel rounded-4 shadow-lg z-2 panel-transition scale-hide"
        style="bottom: 80px; left: 50%; transform: translateX(-50%); width: 700px; height: 550px; display: flex; flex-direction: column;">
        <div class="p-4 border-bottom border-secondary border-opacity-25">
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control bg-transparent border-start-0 shadow-none"
                    placeholder="Type to search...">
            </div>
        </div>
        <div class="d-flex flex-grow-1 overflow-hidden p-2 gap-2">
            <div class="w-50 overflow-auto p-3">
                <h6 class="text-uppercase small text-muted fw-bold mb-3">Pinned Apps</h6>
                <div class="start-item d-flex align-items-center p-2 rounded-3 mb-1"
                    onclick="WindowManager.openWindow({id:'win-obj', title:'Object Detection', url:'project/object-detection/index.html', width:'900px', height:'650px'})">
                    <div class="adaptive-icon-sm grad-green me-3"><i class="bi bi-camera text-white"></i></div>
                    <span class="fw-medium">Object Detection</span>
                </div>
                <div class="start-item d-flex align-items-center p-2 rounded-3 mb-1"
                    onclick="WindowManager.openQRGenerator()">
                    <div class="adaptive-icon-sm grad-purple me-3"><i class="bi bi-qr-code text-white"></i></div>
                    <span class="fw-medium">QR Generator</span>
                </div>
                <div class="start-item d-flex align-items-center p-2 rounded-3 mb-1"
                    onclick="WindowManager.openAbout()">
                    <div class="adaptive-icon-sm grad-blue me-3"><i class="bi bi-person text-white"></i></div>
                    <span class="fw-medium">About Author</span>
                </div>
            </div>
            <div
                class="w-50 p-3 overflow-auto rounded-3 bg-dark bg-opacity-10 border border-secondary border-opacity-25">
                <h6 class="text-uppercase small text-muted fw-bold mb-3">Widgets</h6>
                <div class="row g-2">

                    <div class="col-12">
                        <div class="p-3 rounded-4 grad-blue text-white shadow-sm h-100 position-relative overflow-hidden"
                            style="cursor: pointer;"
                            onclick="WindowManager.openWindow({id:'win-inspiro', title:'Inspiro Dashboard', url:'project/inspiro/index.html', width:'1000px', height:'600px'})">

                            <div class="position-absolute"
                                style="right: -15px; bottom: -25px; opacity: 0.2; font-size: 6rem;">
                                <i class="bi bi-cloud-sun weather-icon"></i>
                            </div>

                            <div class="d-flex justify-content-between mb-2 position-relative z-1">
                                <span class="fw-medium">Cuaca Saat Ini</span>
                                <div class="fs-4"><i class="bi bi-cloud-sun weather-icon"></i></div>
                            </div>

                            <h2 class="mb-0 fw-bold weather-temp position-relative z-1">--°C</h2>
                            <small class="weather-desc position-relative z-1 text-capitalize">Mengambil data...</small>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div
            class="p-3 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center bg-dark bg-opacity-10 rounded-bottom-4">
            <div class="d-flex align-items-center px-2 py-1 rounded-3 hover-bg">
                <div class="rounded-circle grad-purple text-white d-flex align-items-center justify-content-center fw-bold me-2 shadow-sm"
                    style="width: 35px; height: 35px;">GR</div>
                <span class="fw-medium">Galih Respati</span>
            </div>
            <button class="btn btn-sm btn-outline-danger border-0"><i class="bi bi-power"></i></button>
        </div>
    </div>

    <div id="clock-panel" class="position-absolute glass-panel rounded-4 shadow-lg z-2 p-4 panel-transition scale-hide"
        style="bottom: 80px; width: 340px;">
        <div class="text-center border-bottom border-secondary border-opacity-25 pb-3 mb-3">
            <h2 class="fw-light mb-0" id="panel-time-large">10:00:00</h2>
            <p class="text-primary fw-medium small mb-0" id="panel-date-large">Senin, 1 Januari</p>
        </div>

        <div class="calendar-container">
            <div class="d-flex justify-content-between align-items-center mb-3 px-1">
                <span class="small fw-bold" id="calendar-month-year">Oktober 2023</span>
                <div class="btn-group">
                    <button class="btn btn-sm btn-calendar" onclick="DesktopUI.changeMonth(-1)"><i
                            class="bi bi-chevron-up"></i></button>
                    <button class="btn btn-sm btn-calendar" onclick="DesktopUI.changeMonth(1)"><i
                            class="bi bi-chevron-down"></i></button>
                </div>
            </div>

            <div class="d-grid text-center mb-2" style="grid-template-columns: repeat(7, 1fr); gap: 4px;">
                <div class="small fw-bold text-muted">Min</div>
                <div class="small fw-bold text-muted">Sen</div>
                <div class="small fw-bold text-muted">Sel</div>
                <div class="small fw-bold text-muted">Rab</div>
                <div class="small fw-bold text-muted">Kam</div>
                <div class="small fw-bold text-muted">Jum</div>
                <div class="small fw-bold text-muted">Sab</div>
            </div>

            <div id="calendar-days-grid" class="d-grid text-center small"
                style="grid-template-columns: repeat(7, 1fr); gap: 4px;">
            </div>
        </div>
    </div>

    <div id="main-taskbar"
        class="position-fixed bottom-0 start-50 translate-middle-x mb-2 taskbar-glass rounded-pill z-3 d-flex align-items-center justify-content-between px-2 shadow-lg"
        style="height: 60px; width: auto; min-width: 400px;">
        <div class="d-flex align-items-center h-100" id="taskbar-apps">
            <button class="btn btn-taskbar mx-1 p-0 rounded-3 border-0 group"
                onclick="DesktopUI.toggleStartMenu(event)">
                <div class="adaptive-icon grad-blue d-flex align-items-center justify-content-center shadow-sm"
                    style="width: 45px; height: 45px;">
                    <i class="bi bi-grid-fill text-white fs-4"></i>
                </div>
            </button>
            <div class="vr mx-2 opacity-25" style="height: 30px;"></div>

            <div id="taskbar-dynamic-apps" class="d-flex align-items-center h-100 gap-1"></div>
        </div>

        <div class="vr mx-2 opacity-25" style="height: 30px;"></div>

        <div class="d-flex align-items-center h-100 px-2 gap-1">
            <button class="btn btn-taskbar border-0 rounded-3 text-on-surface" onclick="DesktopUI.toggleTheme()"><i
                    class="bi bi-moon-stars"></i></button>
            <button
                class="btn btn-taskbar border-0 rounded-3 d-flex flex-column align-items-center justify-content-center px-3"
                onclick="DesktopUI.toggleClockPanel(event)">
                <span class="small fw-medium" id="taskbar-time" style="line-height: 1.2;">10:00 AM</span>
                <span style="font-size: 0.65rem; line-height: 1;">24/10/23</span>
            </button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/script/js/component.js"></script>
    <script type="module" src="assets/script/js/script.js"></script>
</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="assets/script/js/component.js"></script>
<script type="module" src="assets/script/js/script.js"></script>
<script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="./assets/script/js/qr-generator.js"></script>

</html>
