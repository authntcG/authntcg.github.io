<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com?plugins=container-queries,typography"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-bs-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#0d6efd',
                        secondary: '#6c757d',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/script/css/style.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body class="text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-gray-900 h-screen w-screen overflow-hidden relative">
    <!-- Preload Page -->
    <app-preloader class="preload-page">
        <progress id="loading-bar" value="0" max="100"></progress>
    </app-preloader>
    <!-- Floating Buttons -->
    <button class="fixed top-4 right-4 bg-white dark:bg-gray-800/50 backdrop-blur-md rounded-full shadow-md w-12 h-12 flex items-center justify-center text-xl hover:bg-white dark:bg-gray-800/80 transition-colors z-40" data-bs-toggle="modal" data-bs-target="#settingsModal"><i
            class="bi bi-gear"></i></button>
    <!-- Clock & Search Area -->
    <div class="container mx-auto px-4 flex justify-center items-center h-full w-full">
        <div class="flex flex-wrap -mx-2 w-full max-w-4xl">
            <div class="w-full px-2 mb-0 text-center sm:text-left">
                <h1 class="text-6xl font-light clock mb-2">Wait...</h1>
                <h6 class="text-lg font-medium pt-0 h-6" id="location-info">
                    Loading...
                </h6>
            </div>
            <form action="https://www.google.com/search" method="get" class="w-full">
                <div class="w-full px-2 mb-2 mt-4">
                    <div class="bg-white dark:bg-gray-800/70 backdrop-blur-md rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                        <div class="p-4">
                            <div class="flex flex-wrap -mx-2">
                                <div class="w-10/12 px-2 relative">
                                    <input type="text" class="w-full pt-6 pb-2 px-3 border border-gray-300 rounded-md outline-none focus:border-blue-500 bg-transparent peer" name="q"
                                        placeholder=" " id="searchInput" required>
                                    <label for="searchInput" class="absolute left-5 top-4 text-gray-500 dark:text-gray-400 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs">Search for...</label>
                                </div>
                                <div class="w-2/12 pl-0 pr-2">
                                    <app-button type="submit" extra-class="w-full h-full text-xl"><i
                                            class="bi bi-search"></i></app-button>
                                </div>
                                <div class="w-full px-2 mt-3 mb-2" id="suggestion-panel">
                                    <div class="flex flex-wrap items-center justify-center text-center -mx-2">
                                        <div class="w-1/4 px-2">
                                            <a href="https://google.com" class="block bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                                                <div class="p-3">
                                                    <i class="bi bi-google text-2xl"></i>
                                                </div>
                                            </a>
                                        </div>
                                        <div class="w-1/4 px-2">
                                            <a href="https://google.com" class="block bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                                                <div class="p-3">
                                                    <i class="bi bi-bing text-2xl"></i>
                                                </div>
                                            </a>
                                        </div>
                                        <div class="w-1/4 px-2">
                                            <a href="https://facebook.com" class="block bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                                                <div class="p-3">
                                                    <i class="bi bi-facebook text-2xl"></i>
                                                </div>
                                            </a>
                                        </div>
                                        <div class="w-1/4 px-2">
                                            <a href="https://instagram.com" class="block bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                                                <div class="p-3">
                                                    <i class="bi bi-instagram text-2xl"></i>
                                                </div>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <app-weather-widget class="w-full px-2 mb-2 mt-4" id="weather-panel"></app-weather-widget>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div class="fixed inset-0 z-50 hidden overflow-y-auto" id="settingsModal" aria-labelledby="settingsModalLabels" aria-hidden="true">
        <div class="fixed inset-0 bg-black/50 transition-opacity" aria-hidden="true" data-bs-dismiss="modal"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative w-full max-w-lg bg-white dark:bg-gray-800 rounded-xl shadow-xl text-gray-800 dark:text-gray-200">
                <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-medium" id="settingsModalLabels"><i class="bi bi-gear"></i> Settings</h2>
                    <button type="button" class="text-gray-400 hover:text-gray-800 dark:text-gray-200 focus:outline-none" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
                </div>
                <div class="p-4">
                    <div class="flex flex-wrap -mx-2">
                        <div class="w-full lg:w-1/2 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-2/3"><p>Hide Weather Panel</p></div>
                                <div class="w-1/3 text-right">
                                    <input class="w-10 h-5 bg-gray-200 rounded-full appearance-none checked:bg-blue-500 transition-colors cursor-pointer" type="checkbox" id="switchWeatherPanel">
                                </div>
                            </div>
                        </div>
                        <div class="w-full lg:w-1/2 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-2/3"><p>Hide Suggestion Link Buttons</p></div>
                                <div class="w-1/3 text-right">
                                    <input class="w-10 h-5 bg-gray-200 rounded-full appearance-none checked:bg-blue-500 transition-colors cursor-pointer" type="checkbox" id="switchSuggestionPanel">
                                </div>
                            </div>
                        </div>
                        <div class="w-full lg:w-1/2 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-2/3"><p>Options 3</p></div>
                                <div class="w-1/3 text-right">
                                    <input class="w-10 h-5 bg-gray-200 rounded-full appearance-none checked:bg-blue-500 transition-colors cursor-pointer" type="checkbox" id="switch3">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-end p-4 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md transition-colors" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Information Modal -->
    <div class="fixed inset-0 z-50 hidden overflow-y-auto" id="infoModal" aria-labelledby="infoModalLabels" aria-hidden="true">
        <div class="fixed inset-0 bg-black/50 transition-opacity" aria-hidden="true" data-bs-dismiss="modal"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative w-full max-w-5xl bg-white dark:bg-gray-800 rounded-xl shadow-xl text-gray-800 dark:text-gray-200">
                <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-medium" id="infoModalLabels"><i class="bi bi-info-circle-fill"></i> Weather & Location Details</h2>
                    <button type="button" class="text-gray-400 hover:text-gray-800 dark:text-gray-200 focus:outline-none" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
                </div>
                <div class="p-4 overflow-y-auto max-h-[75vh]">
                    <div class="flex flex-wrap -mx-2">
                        <div class="w-full px-2 mb-2">
                            <h5 class="text-lg font-medium"><i class="bi bi-pin-map"></i> Address Information</h5>
                        </div>
                        <div class="w-full px-2 mb-2">
                            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                                <div class="p-4">
                                    <div class="flex flex-wrap -mx-2 items-center">
                                        <div class="w-full lg:w-1/3 px-2">
                                            <h6 class="font-medium"><i class="bi bi-crosshair"></i> Current Location</h6>
                                        </div>
                                        <div class="w-full lg:w-2/3 px-2">
                                            <p id="infoLocation" class="mb-0"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="w-full lg:w-1/2 px-2 mb-2">
                            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 h-full">
                                <div class="p-4">
                                    <div class="flex flex-wrap -mx-2 items-center">
                                        <div class="w-full lg:w-1/3 px-2">
                                            <h6 class="font-medium"><i class="bi bi-arrows"></i> Latitude</h6>
                                        </div>
                                        <div class="w-full lg:w-2/3 px-2">
                                            <p id="infoLatitude" class="mb-0"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="w-full lg:w-1/2 px-2 mb-2">
                            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 h-full">
                                <div class="p-4">
                                    <div class="flex flex-wrap -mx-2 items-center">
                                        <div class="w-full lg:w-1/3 px-2">
                                            <h6 class="font-medium"><i class="bi bi-arrows-vertical"></i> Longitude</h6>
                                        </div>
                                        <div class="w-full lg:w-2/3 px-2">
                                            <p id="infoLongitude" class="mb-0"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="w-full px-2 mb-2">
                            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                                <div class="p-4">
                                    <app-map id="infoMaps"></app-map>
                                </div>
                            </div>
                        </div>
                        <!-- Line Divider and New Titles -->
                        <div class="w-full px-2 mb-2">
                            <hr class="my-4 border-gray-200 dark:border-gray-700">
                            <h5 class="text-lg font-medium"><i class="bi bi-thermometer-sun"></i> Weather Forecast</h5>
                        </div>
                        <app-weather-details class="w-full px-2"></app-weather-details>
                    </div>
                </div>
                <div class="flex items-center justify-end p-4 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md transition-colors" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <app-footer></app-footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script src="../../assets/script/js/component.js"></script>
    <script type="module" src="../../assets/script/js/weather-component.js"></script>
    <script type="module" src="../../assets/script/js/script.js"></script>
</body>
</html>
