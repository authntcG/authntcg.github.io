<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Detection | AuthntcG</title>
  <script src="https://cdn.tailwindcss.com?plugins=container-queries,typography"></script>
  <script>
      tailwind.config = {
          darkMode: ['class', '[data-bs-theme="dark"]']
      }
  </script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    /* Tailwind CDN Fallback for FOUC Prevention */
    [data-bs-theme="dark"] #preload { background-color: #111827 !important; color: #e5e7eb !important; }
    [data-bs-theme="light"] #preload { background-color: #f9fafb !important; color: #1f2937 !important; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
    }
  </style>
  <script>
      (function () {
          const savedTheme = localStorage.getItem('authntcg-theme');
          if (savedTheme) {
              document.documentElement.setAttribute('data-bs-theme', savedTheme);
          } else {
              const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
              document.documentElement.setAttribute('data-bs-theme', isDarkMode ? 'dark' : 'light');
          }
      })();
  </script>
</head>

<body class="bg-gray-50/50 dark:bg-gray-900/50 text-gray-800 dark:text-gray-200 @container h-screen w-screen overflow-hidden flex flex-col">
  <div id="preload" class="preload-page flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 absolute inset-0 z-50">
      <iconify-icon icon="line-md:loading-loop" class="text-4xl text-blue-500 mb-4"></iconify-icon>
      <p class="text-sm font-medium tracking-widest uppercase animate-pulse text-gray-800 dark:text-gray-200">Loading Model...</p>
      <progress id="loading-bar" value="0" max="100" class="hidden"></progress>
  </div>

  <div class="p-4 @lg:p-6 max-w-7xl w-full mx-auto space-y-4 flex-grow flex flex-col h-full overflow-y-auto custom-scrollbar">
        <!-- HEADER -->
    <div class="flex items-center justify-between mb-4 shrink-0">
       <div class="flex items-center gap-3">
                    <!-- Unified Title Pill -->
          <div class="inline-flex items-center gap-3 bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl px-4 py-2.5 rounded-full border border-gray-200/60 dark:border-gray-700/60 shadow-sm">
              <iconify-icon icon="fluent:scan-object-24-filled" class="text-xl text-blue-600 dark:text-blue-400"></iconify-icon>
              <h2 class="text-sm font-extrabold text-gray-800 dark:text-gray-200 tracking-wide m-0 leading-none">Object Detection</h2>
              <span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
              <span class="text-[10px] text-gray-500 font-bold tracking-widest uppercase leading-none mt-0.5">COCO-SSD</span>
          </div>
       </div>
    </div>

    <!-- BENTO GRID -->
    <div class="grid grid-cols-1 @2xl:grid-cols-3 gap-4 grow">
       
       <!-- LEFT: MEDIA PLAYER (Span 2) -->
       <div class="@2xl:col-span-2 rounded-3xl overflow-hidden shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl p-4 flex flex-col relative group h-[400px] @2xl:h-auto min-h-[400px]">
          <div class="absolute -left-20 -top-20 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>
          
          <div class="flex justify-between items-center mb-3 relative z-10 shrink-0">
             <div class="flex items-center gap-2">
                 <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="live-indicator"></span>
                 <span class="text-sm font-bold tracking-wide uppercase text-gray-700 dark:text-gray-300" id="current-mode-title">Live Camera</span>
             </div>
             
                          <!-- Switch camera button -->
             <button id="btn-switch-cam" class="h-8 px-3 shrink-0 rounded-xl bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2" title="Switch Camera">
                 <iconify-icon icon="fluent:camera-switch-24-filled" class="text-lg"></iconify-icon>
                 <span class="text-xs font-bold tracking-wide">SWITCH</span>
             </button>
          </div>

          <!-- MEDIA CONTAINERS -->
          <div class="relative rounded-2xl overflow-hidden bg-black/95 flex-grow shadow-inner w-full border border-gray-200/20 dark:border-gray-700/50">
             
             <!-- LIVE -->
             <div id="live" class="tab-pane absolute inset-0 w-full h-full block">
                <video id="webcam" autoplay playsinline muted class="w-full h-full object-contain"></video>
                <canvas id="canvas-live" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
             </div>
             
             <!-- VIDEO -->
             <div id="video" class="tab-pane absolute inset-0 w-full h-full hidden">
                <video id="video-file" controls playsinline loop muted autoplay class="w-full h-full object-contain"></video>
                <canvas id="canvas-video" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
             </div>
             
             <!-- IMAGE -->
             <div id="image" class="tab-pane absolute inset-0 w-full h-full hidden flex items-center justify-center">
                <img id="image-file" alt="Preview" class="w-full h-full object-contain" />
                <canvas id="canvas-image" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
             </div>
             
          </div>
       </div>

       <!-- RIGHT COLUMN -->
       <div class="flex flex-col gap-4 @2xl:col-span-1 min-h-[400px]">
           <!-- BENTO: MODE SELECTOR -->
           <div class="rounded-3xl p-5 shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl relative overflow-hidden group hover:shadow-lg transition-all shrink-0">
               <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Input Source</h3>
               <div class="flex flex-col gap-2" id="detectionTabs">
                   
                   <button class="relative flex items-center gap-3 p-3 rounded-xl custom-tab-btn active transition-all text-left bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50" data-mode="live" data-target="#live">
                       <div class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-800/50 flex items-center justify-center shrink-0 icon-bg transition-colors">
                          <iconify-icon icon="fluent:camera-24-filled" class="text-lg"></iconify-icon>
                       </div>
                       <div class="leading-tight">
                           <div class="font-bold text-sm">Webcam</div>
                           <div class="text-[10px] opacity-80">Real-time inference</div>
                       </div>
                   </button>
                   
                   <button class="relative flex items-center gap-3 p-3 rounded-xl custom-tab-btn transition-all text-left hover:bg-gray-50 dark:hover:bg-gray-800/50 text-gray-600 dark:text-gray-400 border border-transparent hover:border-gray-200 dark:hover:border-gray-700" data-mode="video" data-target="#video">
                       <div class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center shrink-0 icon-bg transition-colors">
                          <iconify-icon icon="fluent:video-24-filled" class="text-lg"></iconify-icon>
                       </div>
                       <div class="leading-tight flex-grow">
                           <div class="font-bold text-sm">Video File</div>
                           <div class="text-[10px] opacity-80">Upload .mp4</div>
                       </div>
                       <input type="file" id="input-video" accept="video/*" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer"  />
                   </button>
                   
                   <button class="relative flex items-center gap-3 p-3 rounded-xl custom-tab-btn transition-all text-left hover:bg-gray-50 dark:hover:bg-gray-800/50 text-gray-600 dark:text-gray-400 border border-transparent hover:border-gray-200 dark:hover:border-gray-700" data-mode="image" data-target="#image">
                       <div class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center shrink-0 icon-bg transition-colors">
                          <iconify-icon icon="fluent:image-24-filled" class="text-lg"></iconify-icon>
                       </div>
                       <div class="leading-tight flex-grow">
                           <div class="font-bold text-sm">Image File</div>
                           <div class="text-[10px] opacity-80">Upload .jpg / .png</div>
                       </div>
                       <input type="file" id="input-image" accept="image/*" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer"  />
                   </button>
               </div>
           </div>

           <!-- BENTO: LOGS -->
           <div class="rounded-3xl p-5 shadow-inner border border-gray-800 bg-[#0a0a0a] text-green-400 font-mono flex flex-col grow relative overflow-hidden group">
               <div class="flex items-center gap-2 mb-3 relative z-10 border-b border-gray-800 pb-2">
                   <iconify-icon icon="fluent:window-console-20-regular"></iconify-icon>
                   <span class="text-[10px] font-bold tracking-widest opacity-70 uppercase">Detection_Stream</span>
               </div>
               
               <textarea id="log-live" class="w-full h-full min-h-[120px] bg-transparent resize-none focus:outline-none text-[10px] leading-relaxed custom-scrollbar block" readonly placeholder="Waiting for model..."></textarea>
               <textarea id="log-video" class="w-full h-full min-h-[120px] bg-transparent resize-none focus:outline-none text-[10px] leading-relaxed custom-scrollbar hidden" readonly placeholder="Awaiting video upload..."></textarea>
               <textarea id="log-image" class="w-full h-full min-h-[120px] bg-transparent resize-none focus:outline-none text-[10px] leading-relaxed custom-scrollbar hidden" readonly placeholder="Awaiting image upload..."></textarea>
           </div>
       </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="script.js"></script>
  
</body>
</html>
