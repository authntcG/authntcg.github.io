<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator | AuthntcG</title>
    <script src="https://cdn.tailwindcss.com?plugins=container-queries,typography"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-bs-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#0d6efd',
                        secondary: '#6c757d',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Tailwind CDN Fallback for FOUC Prevention */
        [data-bs-theme="dark"] #preload { background-color: #111827 !important; color: #e5e7eb !important; }
        [data-bs-theme="light"] #preload { background-color: #f9fafb !important; color: #1f2937 !important; }

        /* Responsive Canvas Fix */
        #qr-canvas-container > *,
        #qr-canvas-container svg,
        #qr-canvas-container canvas {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            display: block !important;
            margin: auto !important;
        }

        /* Decorative Frames */
        #qr-frame-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .frame-text-display {
            display: none;
            text-align: center;
            font-weight: 800;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: 2px;
        }

        .frame-none {
            padding: 0;
            background: transparent;
        }

        .frame-scan-me {
            background: #111;
            padding: 25px 25px 60px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .frame-scan-me .frame-text-display {
            display: block;
            color: #fff;
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            font-size: 1.2rem;
        }

        .frame-polaroid {
            background: #fff;
            padding: 20px 20px 70px 20px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .frame-polaroid .frame-text-display {
            display: block;
            color: #333;
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0;
        }

        .frame-modern {
            background: linear-gradient(135deg, #0061ff 0%, #60efff 100%);
            padding: 30px;
            border-radius: 30px;
        }

        .frame-modern .frame-text-display {
            display: block;
            color: #fff;
            margin-top: 15px;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .preload-hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        
        /* Memaksa browser mengizinkan scroll dan menyesuaikan tinggi khusus di halaman ini */
        html, body {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            height: auto !important;
            min-height: 100vh;
        }
        
        /* Custom Scrollbar (Golden Standard) */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('authntcg-theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
            } else {
                const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-bs-theme', isDarkMode ? 'dark' : 'light');
            }
        })();
    </script>
</head>

<body class="bg-gray-50/50 dark:bg-gray-900/50 text-gray-800 dark:text-gray-200 @container min-h-screen">
    <div id="preload" class="preload-page flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 fixed inset-0 z-[9999] transition-opacity duration-500">
        <iconify-icon icon="line-md:loading-loop" class="text-4xl text-blue-500 mb-4"></iconify-icon>
        <p class="text-sm font-medium tracking-widest uppercase animate-pulse">Loading App...</p>
    </div>

    <div class="container mx-auto px-4 py-4 max-w-4xl">

        <div class="mb-4 hidden" id="standalone-back-btn">
            <a href="../../index.html" class="inline-block px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-sm transition-colors shadow-sm">
                <iconify-icon icon="fluent:chevron-left-24-filled" class="align-text-bottom mr-1"></iconify-icon> Back To Home
            </a>
        </div>

        <div id="qr-app-content" class="@container">
            <div class="p-4" >
                <div class="inline-flex items-center gap-3 bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl px-4 py-2.5 rounded-full border border-gray-200/60 dark:border-gray-700/60 shadow-sm mb-6">
                    <iconify-icon icon="fluent:qr-code-24-filled" class="text-xl text-blue-600 dark:text-blue-400"></iconify-icon>
                    <h2 class="text-sm font-extrabold text-gray-800 dark:text-gray-200 tracking-wide m-0 leading-none">Custom QR Generator</h2>
                </div>

                <div class="grid grid-cols-1 @2xl:grid-cols-3 gap-6">
                    <div class="@2xl:col-span-2 flex flex-col gap-4">
                        <div class="rounded-3xl shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl mb-4">
                            <div class="p-5">
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"><iconify-icon icon="fluent:text-field-24-filled" class="text-lg"></iconify-icon> Data QR Code</h3>
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Tipe Konten</label>
                                    <select id="qr-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500">
                                        <option value="url">Tautan (URL)</option>
                                        <option value="text">Teks Bebas</option>
                                        <option value="email">Kirim Email</option>
                                        <option value="wifi">Koneksi Wi-Fi</option>
                                    </select>
                                </div>
                                <div id="qr-dynamic-inputs" class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Masukkan Tautan URL</label>
                                    <input type="url" id="qr-input-url" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500"
                                        value="https://authntcg.github.io">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">Data Mentah Output</label>
                                    <textarea id="qr-raw-data" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-xs font-mono bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500" rows="2"
                                        readonly></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="rounded-3xl shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl mb-4">
                            <div class="p-5">
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"><iconify-icon icon="fluent:options-24-filled" class="text-lg"></iconify-icon> Opsi Utama</h3>
                                <div class="mb-2">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Ukuran QR: <span
                                            id="qr-size-val">300</span>px</label>
                                    <input type="range" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="qr-size" min="200" max="500" step="10"
                                        value="300">
                                </div>
                                <div class="mb-1">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Margin: <span id="qr-margin-val">10</span>px</label>
                                    <input type="range" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="qr-margin" min="0" max="50" step="5"
                                        value="10">
                                </div>
                            </div>
                        </div>

                        <div class="rounded-3xl shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl mb-4">
                            <div class="p-5">
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"><iconify-icon icon="fluent:paint-brush-24-filled" class="text-lg"></iconify-icon> Desain Visual</h3>
                                <div class="mb-4">
                                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Warna Latar</label>
                                    <input type="color" id="qr-bg-color" class="w-full h-10 p-1 bg-white dark:bg-gray-800/50 border border-gray-300 dark:border-gray-600 rounded-xl cursor-pointer shadow-sm" value="#ffffff">
                                </div>

                                <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Pola Titik (Dots)</label>
                                <div class="flex flex-wrap -mx-1 mb-4">
                                    <div class="w-2/3 px-1">
                                        <select id="qr-dots-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500">
                                            <option value="square">Kotak</option>
                                            <option value="rounded" selected>Bulat</option>
                                            <option value="dots">Titik</option>
                                            <option value="classy">Classy</option>
                                        </select>
                                    </div>
                                    <div class="w-1/3 px-1"><input type="color" id="qr-dots-color"
                                            class="w-full h-8 p-0 border-0 rounded-xl cursor-pointer shadow-sm" value="#000000"></div>
                                </div>

                                <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Sudut (Corners)</label>
                                <div class="flex flex-wrap -mx-1 mb-3">
                                    <div class="w-2/3 px-1">
                                        <select id="qr-corner-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500">
                                            <option value="square">Kotak</option>
                                            <option value="extra-rounded" selected>Extra Bulat</option>
                                        </select>
                                    </div>
                                    <div class="w-1/3 px-1"><input type="color" id="qr-corner-color"
                                            class="w-full h-8 p-0 border-0 rounded-xl cursor-pointer" value="#000000"></div>
                                </div>

                                <hr class="my-4 border-gray-300 dark:border-gray-600 opacity-25">
                                <div class="flex flex-wrap -mx-1 mb-3">
                                    <div class="w-full px-1 mb-3">
                                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Gaya Bingkai</label>
                                        <select id="qr-frame-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500">
                                            <option value="frame-none" selected>Tanpa Bingkai</option>
                                            <option value="frame-scan-me">Scan Me (Hitam)</option>
                                            <option value="frame-polaroid">Polaroid (Putih)</option>
                                            <option value="frame-modern">Modern (Biru)</option>
                                        </select>
                                    </div>
                                    <div id="qr-frame-text-group" class="w-full px-1 hidden">
                                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Teks pada Bingkai</label>
                                        <div class="flex items-center bg-white dark:bg-gray-800/50 backdrop-blur-md border border-gray-300 dark:border-gray-600 rounded-xl overflow-hidden">
                                            <span class="px-3 text-gray-500 dark:text-gray-400 bg-transparent"><iconify-icon icon="fluent:text-font-24-filled"></iconify-icon></span>
                                            <input type="text" id="qr-frame-text"
                                                class="w-full py-1.5 px-2 bg-transparent outline-none text-sm"
                                                value="SCAN ME">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="rounded-3xl shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl mb-6">
                            <div class="p-5">
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"><iconify-icon icon="fluent:image-24-filled" class="text-lg"></iconify-icon> Logo</h3>
                                <input type="file" id="qr-logo-file" accept="image/png, image/jpeg, image/svg+xml"
                                    class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 mb-3">
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Skala Logo: <span
                                        id="qr-logo-size-val">0.3</span></label>
                                <input type="range" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="qr-logo-size" min="0.1" max="0.4" step="0.05"
                                    value="0.3">
                            </div>
                        </div>
                    </div>

                    <div class="@2xl:col-span-1 flex flex-col gap-4">
                        <div class="sticky top-4 z-10">
                            <div class="rounded-3xl shadow-sm border border-gray-200/60 dark:border-gray-700/60 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl text-center">
                                <div class="p-5">
                                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center justify-center gap-2"><iconify-icon icon="fluent:eye-show-24-filled" class="text-lg"></iconify-icon> Pratinjau QR</h3>

                                    <div id="qr-frame-wrapper" class="frame-none mx-auto mb-6">
                                        <div class="bg-white dark:bg-gray-800 rounded-xl mx-auto"
                                            style="position: relative; width: 100%; max-width: 250px; aspect-ratio: 1 / 1; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                                            <div id="qr-canvas-container"
                                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                                            </div>
                                        </div>
                                        <div class="frame-text-display">SCAN ME</div>
                                    </div>

                                    <div class="flex rounded-xl shadow-sm">
                                        <select id="qr-download-ext" class="px-3 h-10 border border-gray-300 dark:border-gray-600 rounded-l-xl text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500"
                                            style="max-width: 90px;">
                                            <option value="png">PNG</option>
                                            <option value="jpeg">JPG</option>
                                            <option value="svg">SVG</option>
                                        </select>
                                        <button class="grow h-10 px-4 rounded-r-xl bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white shadow-md shadow-blue-500/20 transition-all flex items-center justify-center font-bold text-sm" id="btn-download-qr">
                                            <iconify-icon icon="fluent:arrow-download-24-filled" class="mr-1"></iconify-icon> Unduh
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../../assets/script/js/component.js"></script>
    <script src="../../assets/script/js/qr-generator.js"></script>

    <script type="module">
        import { AppConfig } from '../../assets/script/js/config.js';
        
        // 1. Atur Tema
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-bs-theme", isDark ? "dark" : "light");
        const baseUrl = isDark ? AppConfig.UI.BG_URL_DARK : AppConfig.UI.BG_URL_LIGHT;
        // Environment Check: Windowed vs Standalone
        if (window.self !== window.top) {
            // WINDOWED MODE: Transparent Background
            document.body.style.background = 'transparent';
            if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
            const preload = document.getElementById('preload');
            if(preload) {
                preload.classList.add('preload-hidden');
                setTimeout(() => preload.style.display = 'none', 500);
            }
            window.dispatchEvent(new Event('app:ready'));
        } else {
            // STANDALONE MODE: Show Back Button and Download Wallpaper
            const backBtn = document.getElementById('standalone-back-btn');
            if(backBtn) backBtn.classList.remove('hidden');

            const bgUrl = `${baseUrl}?lock=${Date.now()}`;
            const img = new Image();
            
            img.onload = () => {
                img.decode().then(() => {
                    document.body.style.backgroundImage = `url('${bgUrl}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundAttachment = 'fixed';

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
                            const preload = document.getElementById('preload');
            if(preload) {
                preload.classList.add('preload-hidden');
                setTimeout(() => preload.style.display = 'none', 500);
            }
            window.dispatchEvent(new Event('app:ready'));
                        });
                    });
                }).catch(() => {
                    document.body.style.backgroundImage = `url('${bgUrl}')`;
                    if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
                    const preload = document.getElementById('preload');
            if(preload) {
                preload.classList.add('preload-hidden');
                setTimeout(() => preload.style.display = 'none', 500);
            }
            window.dispatchEvent(new Event('app:ready'));
                });
            };

            img.onerror = () => {
                if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
                const preload = document.getElementById('preload');
            if(preload) {
                preload.classList.add('preload-hidden');
                setTimeout(() => preload.style.display = 'none', 500);
            }
            window.dispatchEvent(new Event('app:ready'));
            };

            img.src = bgUrl;
        }
    </script>
    <script>
        // Sync Theme from OS
        const updateTheme = () => {
            const savedTheme = localStorage.getItem('authntcg-theme');
            if (savedTheme) {
                document.documentElement.setAttribute("data-bs-theme", savedTheme);
            } else {
                const isDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.setAttribute("data-bs-theme", isDarkMode ? "dark" : "light");
            }
        };
        updateTheme();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
            if(!localStorage.getItem('authntcg-theme')) updateTheme();
        });
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'THEME_CHANGED') {
                document.documentElement.setAttribute("data-bs-theme", event.data.theme);
            }
        });
    </script>
</body>

</html>
