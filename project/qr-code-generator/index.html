<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator | AuthntcG</title>
    <script src="https://cdn.tailwindcss.com?plugins=container-queries,typography"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-bs-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#0d6efd',
                        secondary: '#6c757d',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/script/css/style.css">
    <style>
        /* Memaksa browser mengizinkan scroll dan menyesuaikan tinggi khusus di halaman ini */
        html, body {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            height: auto !important;
            min-height: 100vh;
        }
    </style>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body>
    <app-preloader class="preload-page">
        <progress id="loading-bar" value="0" max="100"></progress>
    </app-preloader>

    <div class="container mx-auto px-4 py-4 max-w-4xl">

        <div class="mb-4">
            <a href="../../index.html" class="inline-block px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded-md text-sm transition-colors">
                <i class="bi bi-chevron-left"></i> Back To Home
            </a>
        </div>

        <div id="qr-app-content" class="@container">
            <div class="p-4" style="color: var(--text-color);">
                <h4 class="mb-6 text-2xl font-medium"><i class="bi bi-qr-code"></i> Custom QR Generator</h4>

                <div class="flex flex-wrap -mx-2">
                    <div class="w-full @2xl:w-7/12 px-2">
                        <div class="bg-white dark:bg-gray-800/10 backdrop-blur-md rounded-xl shadow-sm border border-transparent mb-4">
                            <div class="p-4">
                                <h6 class="text-lg font-bold mb-4"><i class="bi bi-input-cursor-text"></i> Data QR Code</h6>
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Tipe Konten</label>
                                    <select id="qr-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica">
                                        <option value="url">Tautan (URL)</option>
                                        <option value="text">Teks Bebas</option>
                                        <option value="email">Kirim Email</option>
                                        <option value="wifi">Koneksi Wi-Fi</option>
                                    </select>
                                </div>
                                <div id="qr-dynamic-inputs" class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Masukkan Tautan URL</label>
                                    <input type="url" id="qr-input-url" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica"
                                        value="https://authntcg.github.io">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">Data Mentah Output</label>
                                    <textarea id="qr-raw-data" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-xs font-mono bg-gray-50 input-mica" rows="2"
                                        readonly></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-gray-800/10 backdrop-blur-md rounded-xl shadow-sm border border-transparent mb-4">
                            <div class="p-4">
                                <h6 class="text-lg font-bold mb-4"><i class="bi bi-sliders"></i> Opsi Utama</h6>
                                <div class="mb-2">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Ukuran QR: <span
                                            id="qr-size-val">300</span>px</label>
                                    <input type="range" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="qr-size" min="200" max="500" step="10"
                                        value="300">
                                </div>
                                <div class="mb-1">
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Margin: <span id="qr-margin-val">10</span>px</label>
                                    <input type="range" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="qr-margin" min="0" max="50" step="5"
                                        value="10">
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-gray-800/10 backdrop-blur-md rounded-xl shadow-sm border border-transparent mb-4">
                            <div class="p-4">
                                <h6 class="text-lg font-bold mb-4"><i class="bi bi-palette"></i> Desain Visual</h6>
                                <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Pola Titik (Dots)</label>
                                <div class="flex flex-wrap -mx-1 mb-4">
                                    <div class="w-2/3 px-1">
                                        <select id="qr-dots-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica">
                                            <option value="square">Kotak</option>
                                            <option value="rounded" selected>Bulat</option>
                                            <option value="dots">Titik</option>
                                            <option value="classy">Classy</option>
                                        </select>
                                    </div>
                                    <div class="w-1/3 px-1"><input type="color" id="qr-dots-color"
                                            class="w-full h-8 p-0 border-0 rounded-md cursor-pointer" value="#000000"></div>
                                </div>

                                <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Sudut (Corners)</label>
                                <div class="flex flex-wrap -mx-1 mb-3">
                                    <div class="w-2/3 px-1">
                                        <select id="qr-corner-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica">
                                            <option value="square">Kotak</option>
                                            <option value="extra-rounded" selected>Extra Bulat</option>
                                        </select>
                                    </div>
                                    <div class="w-1/3 px-1"><input type="color" id="qr-corner-color"
                                            class="w-full h-8 p-0 border-0 rounded-md cursor-pointer" value="#000000"></div>
                                </div>

                                <hr class="my-4 border-gray-300 dark:border-gray-600 opacity-25">
                                <div class="flex flex-wrap -mx-1 mb-3">
                                    <div class="w-full px-1 mb-3">
                                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Gaya Bingkai</label>
                                        <select id="qr-frame-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica">
                                            <option value="frame-none" selected>Tanpa Bingkai</option>
                                            <option value="frame-scan-me">Scan Me (Hitam)</option>
                                            <option value="frame-polaroid">Polaroid (Putih)</option>
                                            <option value="frame-modern">Modern (Biru)</option>
                                        </select>
                                    </div>
                                    <div id="qr-frame-text-group" class="w-full px-1 hidden">
                                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-200 mb-1">Teks pada Bingkai</label>
                                        <div class="flex items-center bg-white dark:bg-gray-800/50 backdrop-blur-md border border-gray-300 dark:border-gray-600 rounded-md overflow-hidden input-mica">
                                            <span class="px-3 text-gray-500 dark:text-gray-400 bg-transparent"><i class="bi bi-fonts"></i></span>
                                            <input type="text" id="qr-frame-text"
                                                class="w-full py-1.5 px-2 bg-transparent outline-none text-sm"
                                                value="SCAN ME">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-gray-800/10 backdrop-blur-md rounded-xl shadow-sm border border-transparent mb-6">
                            <div class="p-4">
                                <h6 class="text-lg font-bold mb-4"><i class="bi bi-image"></i> Logo</h6>
                                <input type="file" id="qr-logo-file" accept="image/png, image/jpeg, image/svg+xml"
                                    class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica mb-3">
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Skala Logo: <span
                                        id="qr-logo-size-val">0.3</span></label>
                                <input type="range" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="qr-logo-size" min="0.1" max="0.4" step="0.05"
                                    value="0.3">
                            </div>
                        </div>
                    </div>

                    <div class="w-full @2xl:w-5/12 px-2">
                        <div class="sticky top-4 z-10">
                            <div class="bg-white dark:bg-gray-800/10 backdrop-blur-md rounded-xl shadow-sm border border-transparent text-center">
                                <div class="p-4">
                                    <h6 class="text-lg font-bold mb-4"><i class="bi bi-eye"></i> Pratinjau QR</h6>

                                    <div id="qr-frame-wrapper" class="frame-none mx-auto mb-6">
                                        <div class="bg-white dark:bg-gray-800 rounded-md mx-auto"
                                            style="position: relative; width: 100%; max-width: 250px; aspect-ratio: 1 / 1; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                                            <div id="qr-canvas-container"
                                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                                            </div>
                                        </div>
                                        <div class="frame-text-display">SCAN ME</div>
                                    </div>

                                    <div class="flex rounded-md shadow-sm">
                                        <select id="qr-download-ext" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-l-md text-sm bg-white dark:bg-gray-800/50 backdrop-blur-md outline-none focus:border-blue-500 input-mica"
                                            style="max-width: 90px;">
                                            <option value="png">PNG</option>
                                            <option value="jpeg">JPG</option>
                                            <option value="svg">SVG</option>
                                        </select>
                                        <button class="grow bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-r-md transition-colors" id="btn-download-qr">
                                            <i class="bi bi-download mr-1"></i> Unduh
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../../assets/script/js/component.js"></script>
    <script src="../../assets/script/js/qr-generator.js"></script>

    <script type="module">
        import { AppConfig } from '../../assets/script/js/config.js';
        
        // 1. Atur Tema
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-bs-theme", isDark ? "dark" : "light");
        const baseUrl = isDark ? AppConfig.UI.BG_URL_DARK : AppConfig.UI.BG_URL_LIGHT;
        const bgUrl = `${baseUrl}?lock=${Date.now()}`;

        // 2. Unduh Gambar Secara Asinkron
        const img = new Image();
        
        img.onload = () => {
            // Jika gambar selesai diunduh, ekstrak (decode) ke memori GPU
            img.decode().then(() => {
                // Pasang ke latar belakang
                document.body.style.backgroundImage = `url('${bgUrl}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundAttachment = 'fixed';

                // THE MAGIC: Tunggu browser benar-benar melukis gambar ke layar
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        // Mulai logika QR Code
                        if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
                        // Beri tahu preloader untuk menghilang sekarang!
                        window.dispatchEvent(new Event('app:ready'));
                    });
                });
            }).catch(() => {
                // Fallback jika browser lawas
                document.body.style.backgroundImage = `url('${bgUrl}')`;
                if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
                window.dispatchEvent(new Event('app:ready'));
            });
        };

        img.onerror = () => {
            // Jika internet terputus, tetap buka loading agar tidak stuck
            if (typeof QRGeneratorLogic !== 'undefined') QRGeneratorLogic.init();
            window.dispatchEvent(new Event('app:ready'));
        };

        // Mulai proses unduh
        img.src = bgUrl;
    </script>
    <script>
        // Sync Theme from OS
        const updateTheme = () => {
            const savedTheme = localStorage.getItem('authntcg-theme');
            if (savedTheme) {
                document.documentElement.setAttribute("data-bs-theme", savedTheme);
            } else {
                const isDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.setAttribute("data-bs-theme", isDarkMode ? "dark" : "light");
            }
        };
        updateTheme();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
            if(!localStorage.getItem('authntcg-theme')) updateTheme();
        });
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'THEME_CHANGED') {
                document.documentElement.setAttribute("data-bs-theme", event.data.theme);
            }
        });
    </script>
</body>

</html>
